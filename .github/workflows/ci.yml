name: CI
on: [push, pull_request]
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Installer les dépendances TP1 à TP5
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements-ci.txt
      - name: Modèle de démonstration, pour les tests de l'API (TP3)
        run: |
          . .venv/bin/activate
          python src/make_demo.py
          python src/train.py
      - name: Outils de qualité (TP4)
        run: . .venv/bin/activate && pip install -r requirements-dev.txt
      - name: Compatibilité des dépendances
        run: . .venv/bin/activate && python -m pip check
      - name: ruff
        run: . .venv/bin/activate && python -m ruff check .
      - name: mypy
        run: . .venv/bin/activate && python -m mypy api
      - name: Tests et couverture
        run: . .venv/bin/activate && python -m pytest -q --cov=api --cov-report=term-missing --cov-fail-under=95

      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Tests du client web
        run: node --test web/client.test.mjs
      - name: Construire et vérifier le paquet hors des sources
        run: |
          . .venv/bin/activate
          python scripts/construire.py
          python scripts/verifier_livrable.py
      - uses: actions/upload-artifact@v4
        with:
          name: sentiment-app-1.0.0
          path: |
            dist/*
            docs/livrable-tp4.txt
